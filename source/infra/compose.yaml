services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: labcopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in source/.env}
      POSTGRES_DB: labcopilot
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - labcopilot-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labcopilot -d labcopilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  labcopilot-postgres:

